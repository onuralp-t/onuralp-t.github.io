<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>booo</title>
</head>

<body>
    <div class="page">
    <div class="header">
        <a class="link" href=".">home</a>
        <a class="link" href="/remember/">remember</a>
    </div>
    <div class="content">

        <div class="vertical">

            <div class="horizontal">

                <div class="list_container">

                    <span class="list_title">Daily compounding yearly interest rate<br></span>

                    <div class="vertical">
                        <label for="yearly_percentage">Enter yearly interest rate (e.g. 31 for %31):</label>
                        <input type="number" id="yearly_percentage" placeholder="0.00">
                        <label for="balance">Enter account balance:</label>
                        <input type="number" id="balance" placeholder="0.00">
                        <label for="time_days">Enter time period in days:</label>
                        <input type="number" id="time_days" placeholder="0.00">

                        <div>Sum: <span id="sum"></span>₺</div>
                        <div>Total gain: <span id="gain"></span>₺</div>
                        <div>Daily gain at start: <span id="daily_gain_start"></span>₺</div>
                        <div>Daily gain at end: <span id="daily_gain_end"></span>₺</div>
                        
                        <script>
                            const yearly_percentage_e = document.getElementById("yearly_percentage");
                            const balance_e = document.getElementById("balance");
                            const time_days_e = document.getElementById("time_days");
                            const sum_e = document.getElementById("sum");
                            const gain_e = document.getElementById("gain");
                            const daily_gain_start_e = document.getElementById("daily_gain_start");
                            const daily_gain_end_e = document.getElementById("daily_gain_end");

                            window.onload = function() {
                                if (localStorage.getItem("yearly_percentage")) {
                                    yearly_percentage_e.value = localStorage.getItem("yearly_percentage");
                                }
                                if (localStorage.getItem("balance")) {
                                    balance_e.value = localStorage.getItem("balance");
                                }
                                if (localStorage.getItem("time_days")) {
                                    time_days_e.value = localStorage.getItem("time_days");
                                }
                                update();
                            };

                            yearly_percentage_e.addEventListener('input', update);
                            balance_e.addEventListener('input', update);
                            time_days_e.addEventListener('input', update);

                            function update() {
                                // Get values
                                const yearly_percentage = yearly_percentage_e.valueAsNumber;
                                const balance = balance_e.valueAsNumber;
                                const time_days = time_days_e.valueAsNumber;

                                // 2. SAVE to localStorage
                                localStorage.setItem("yearly_percentage", yearly_percentage_e.value);
                                localStorage.setItem("balance", balance_e.value);
                                localStorage.setItem("time_days", time_days_e.value);
                                

                                // Validation: If any input is empty/not a number, stop
                                if (isNaN(yearly_percentage) || isNaN(balance) || isNaN(time_days)) {
                                    sum_e.innerText = "0.00";
                                    gain_e.innerText = "0.00";
                                    gain_per_day_start_e.innerText = "0.00";
                                    return;
                                }

                                // Calculation logic
                                const fraction_added = Math.pow((1 + (yearly_percentage / 36500)), time_days) - 1;

                                const totalSum = balance * (fraction_added + 1);
                                const totalGain = totalSum - balance;

                                // Display results
                                sum_e.innerText = totalSum.toFixed(2);
                                gain_e.innerText = totalGain.toFixed(2);
                                daily_gain_start_e.innerText = ((yearly_percentage / 36500) * balance).toFixed(2);
                                daily_gain_end_e.innerText = ((yearly_percentage / 36500) * Number(sum_e.innerText)).toFixed(2);
                            }
                        </script>
                    </div>
                </div>

            </div>

        </div>
    </div>
    <div class="footer">
        <a class="link" href="https://github.com/onuralp-t/onuralp-t.github.io">GITHUB</a>
    </div>
    </div>
</body>

</html>
